<style>

  .sidebar .tagline {

    font-style: italic;
    color: #6b5d4a;
    margin: 0 24px 24px;
  }
  .module-title {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;

  .lesson-item {
    display: block;

  .concept li { margin: 6px 0; }
  .concept code {

  /* Editor */

  /* Result label */

  /* Solution panel */
  .solution-panel {

  /* Nav */
  .nav {

  .nav-btn {

  .nav-btn:hover:not(:disabled) { background: #a93e25; }

  /* Responsive */

  .cm-readonly .CodeMirror { padding: 14px 0; }
  .cm-editor .CodeMirror {

  /* JSX syntax colors */
  .cm-s-default .cm-keyword   { color: #e3a06b; }
  .cm-s-default .cm-atom      { color: #c792ea; }
  .cm-s-default .cm-string    { color: #b8d68c; }
  .cm-s-default .cm-string-2  { color: #b8d68c; }

  .cm-s-default .cm-tag       { color: #ec9080; }

  .cm-s-default .cm-variable  { color: #f5f0e0; }
  .cm-s-default .cm-variable-2{ color: #82aaff; }

<body>
<div id="root"><div class="loading">Loading React Bolt…</div></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// ───────────────────────────────────────────────────────────
// LESSON DATA
// ───────────────────────────────────────────────────────────

const LESSONS = [
  {
    id: '1.1',
    title: 'useState: storing a value that changes',
    concept: `
      <p>React components <strong>re-run their function on every render</strong>. Plain variables get reset each time. <code>useState</code> gives you a value that <em>persists</em> across renders.</p>
      <pre><code>const [count, setCount] = useState(0);</code></pre>
      <p>You get back an array with two things:</p>
      <ul>
        <li><code>count</code> — the current value</li>
        <li><code>setCount</code> — a function to update it (calling it triggers a re-render)</li>
      </ul>
      <p><code>useState(0)</code> sets the initial value to <code>0</code>. That argument is only used on the very first render.</p>
      <p><strong>Rule:</strong> never assign to <code>count</code> directly. Always go through <code>setCount</code>.</p>
    `,
    exampleCode: `function Example() {
  const [count, setCount] = useState(0);

  return (
    <div>
      <p>Count: {count}</p>
      <button onClick={() => setCount(count + 1)}>+1</button>
    </div>
  );
}`,
    exerciseDescription: `
      <p>Build a likes counter:</p>
      <ul>
        <li>State <code>likes</code>, starts at <code>0</code></li>
        <li>A <code>❤</code> button that increases the count by 1</li>
        <li>A <code>💔</code> button that decreases by 1, <strong>but never below 0</strong></li>
        <li>Display the current likes</li>
      </ul>
    `,
    starterCode: `function Exercise() {
  // Hint: const [likes, setLikes] = useState(0);

  return (
    <div>
      <p>Likes: 0</p>
      <button>❤</button>{' '}
      <button>💔</button>
    </div>
  );
}`,
    solution: `function Exercise() {
  const [likes, setLikes] = useState(0);

  return (
    <div>
      <p>Likes: {likes}</p>
      <button onClick={() => setLikes(likes + 1)}>❤</button>{' '}
      <button onClick={() => setLikes(Math.max(0, likes - 1))}>💔</button>
    </div>
  );
}`,
  },

  {
    id: '1.2',
    title: 'Boolean state & toggling',
    concept: `
      <p><code>useState</code> works with any type of value, including <strong>booleans</strong> (<code>true</code> / <code>false</code>). Booleans are how you remember on/off states: open/closed, visible/hidden, expanded/collapsed.</p>
      <pre><code>const [isOn, setIsOn] = useState(false);</code></pre>
      <p>To <strong>toggle</strong> a boolean, set it to the opposite of its current value:</p>
      <pre><code>setIsOn(!isOn);</code></pre>
      <p>(There's a safer "updater function" form for this you'll see in Lesson 1.6. For now this works.)</p>
    `,
    exampleCode: `function Example() {
  const [isOn, setIsOn] = useState(false);

  return (
    <div>
      <p>The light is: {isOn ? 'ON 💡' : 'OFF'}</p>
      <button onClick={() => setIsOn(!isOn)}>Toggle</button>
    </div>
  );
}`,
    exerciseDescription: `
      <p>Build a subscribe toggle:</p>
      <ul>
        <li>State <code>isSubscribed</code>, starts <code>false</code></li>
        <li>Display: <code>"You are subscribed ✅"</code> when on, <code>"Not subscribed ❌"</code> when off</li>
        <li>One button whose label <em>changes</em>: <code>"Subscribe"</code> when off, <code>"Unsubscribe"</code> when on</li>
      </ul>
    `,
    starterCode: `function Exercise() {
  // TODO: add boolean state and a toggle button

  return (
    <div>
      {/* your code here */}
    </div>
  );
}`,
    solution: `function Exercise() {
  const [isSubscribed, setIsSubscribed] = useState(false);

  return (
    <div>
      <p>{isSubscribed ? 'You are subscribed ✅' : 'Not subscribed ❌'}</p>
      <button onClick={() => setIsSubscribed(!isSubscribed)}>
        {isSubscribed ? 'Unsubscribe' : 'Subscribe'}
      </button>
    </div>
  );
}`,
  },

  {
    id: '1.3',
    title: 'Conditional rendering',
    concept: `
      <p>Inside JSX, anything in <code>{ }</code> is regular JavaScript. That means you can use JS to decide what to render. Three common patterns:</p>
      <p><strong>1. The <code>&amp;&amp;</code> pattern</strong> — show something only if a condition is true:</p>
      <pre><code>{isLoggedIn &amp;&amp; &lt;p&gt;Welcome back!&lt;/p&gt;}</code></pre>
      <p><strong>2. The ternary</strong> — show one thing or another:</p>
      <pre><code>{isLoggedIn ? &lt;p&gt;Welcome&lt;/p&gt; : &lt;p&gt;Please log in&lt;/p&gt;}</code></pre>
      <p><strong>3. Early return</strong> — branch the whole component:</p>
      <pre><code>if (loading) return &lt;p&gt;Loading...&lt;/p&gt;;
return &lt;ActualUI /&gt;;</code></pre>
      <p><strong>Gotcha:</strong> <code>&amp;&amp;</code> with a number renders the number on screen.</p>
      <pre><code>{items.length &amp;&amp; &lt;List/&gt;}      // renders "0" when length is 0
{items.length &gt; 0 &amp;&amp; &lt;List/&gt;}  // ✓ compare to make it a boolean</code></pre>
    `,
    exampleCode: `function Example() {
  const [isLoggedIn, setIsLoggedIn] = useState(false);

  return (
    <div>
      {isLoggedIn
        ? <p>Welcome back, Alex!</p>
        : <p>Please log in.</p>}
      {isLoggedIn && <p>You have 3 new messages.</p>}
      <button onClick={() => setIsLoggedIn(!isLoggedIn)}>
        {isLoggedIn ? 'Log out' : 'Log in'}
      </button>
    </div>
  );
}`,
    exerciseDescription: `
      <p>Build a counter that shows different messages depending on the value:</p>
      <ul>
        <li>State <code>count</code>, starts at <code>0</code></li>
        <li>A <code>+1</code> button</li>
        <li>If <code>count === 0</code> → show <code>"Empty!"</code></li>
        <li>If <code>count &gt; 0</code> → show the count</li>
        <li>If <code>count &gt;= 10</code> → ALSO show <code>"🔥 You're on fire!"</code></li>
      </ul>
    `,
    starterCode: `function Exercise() {
  const [count, setCount] = useState(0);

  return (
    <div>
      {/* TODO: show the right message(s) based on count */}
      <button>+1</button>
    </div>
  );
}`,
    solution: `function Exercise() {
  const [count, setCount] = useState(0);

  return (
    <div>
      {count === 0 && <p>Empty!</p>}
      {count > 0 && <p>Count: {count}</p>}
      {count >= 10 && <p>🔥 You're on fire!</p>}
      <button onClick={() => setCount(count + 1)}>+1</button>
    </div>
  );
}`,
  },

  {
    id: '1.4',
    title: 'Controlled text inputs',
    concept: `
      <p>In React, form inputs are usually <strong>controlled</strong>: their value comes from state, and state updates on every keystroke.</p>
      <pre><code>const [text, setText] = useState('');

&lt;input
  value={text}                                // state drives the input
  onChange={(e) =&gt; setText(e.target.value)}   // input updates state
/&gt;</code></pre>
      <p>Now <code>text</code> is always in sync with what's on screen, and you can use it anywhere — display it, validate it, submit it.</p>
      <p><code>e.target.value</code> is always a <strong>string</strong>, even from <code>&lt;input type="number"&gt;</code>. If you need a number, convert with <code>Number(...)</code> or <code>parseInt(...)</code>.</p>
    `,
    exampleCode: `function Example() {
  const [name, setName] = useState('');

  return (
    <div>
      <input
        value={name}
        onChange={(e) => setName(e.target.value)}
        placeholder="Type your name"
      />
      <p>Hello, {name || 'stranger'}!</p>
    </div>
  );
}`,
    exerciseDescription: `
      <p>Build a character counter:</p>
      <ul>
        <li>A text input (or <code>&lt;textarea&gt;</code>) the user can type into</li>
        <li>Below it, show <code>"X / 100 characters"</code></li>
        <li>When the length goes <em>over</em> 100, show the count in red</li>
      </ul>
    `,
    starterCode: `function Exercise() {
  // TODO: state for the text

  return (
    <div>
      <textarea rows={3} cols={32} />
      <p>0 / 100 characters</p>
    </div>
  );
}`,
    solution: `function Exercise() {
  const [text, setText] = useState('');
  const isOver = text.length > 100;

  return (
    <div>
      <textarea
        rows={3}
        cols={32}
        value={text}
        onChange={(e) => setText(e.target.value)}
      />
      <p style={{ color: isOver ? 'red' : 'inherit' }}>
        {text.length} / 100 characters
      </p>
    </div>
  );
}`,
  },

  {
    id: '1.5',
    title: 'Multiple state variables',
    concept: `
      <p>A component can call <code>useState</code> as many times as you want. Each piece of state is independent.</p>
      <pre><code>const [firstName, setFirstName] = useState('');
const [lastName,  setLastName]  = useState('');</code></pre>
      <p><strong>Rule of thumb:</strong> split state when the values change independently. Group them into one object only when they always change together.</p>

setForm({ first: 'Alex' });

// CORRECT
setForm({ ...form, first: 'Alex' });</code></pre>

    `,

  {

    title: 'The updater function form',
    concept: `
      <p>Setters can be called with a value OR with a function:</p>
      <pre><code>setCount(count + 1);          // value form
setCount((c) =&gt; c + 1);       // updater function form</code></pre>
      <p>Most of the time they're equivalent. But when you update the same state multiple times in a row, the value form silently breaks:</p>
      <pre><code>// BUG: clicking only adds 1, not 3
function handleClick() {
  setCount(count + 1);
  setCount(count + 1);
  setCount(count + 1);

      <p>Why? <code>count</code> was captured at the start of the render — it's the same value all three times.</p>
      <pre><code>// CORRECT: each updater receives the latest value
function handleClick() {
  setCount((c) =&gt; c + 1);
  setCount((c) =&gt; c + 1);
  setCount((c) =&gt; c + 1);
}</code></pre>

    setCount((c) => c + 1);

// ───────────────────────────────────────────────────────────
// CODE COMPILER & PREVIEW
// ───────────────────────────────────────────────────────────

function compileComponent(code, componentName) {
  const wrapped = code + '\n;return typeof ' + componentName + ' !== "undefined" ? ' + componentName + ' : null;';
  const compiled = Babel.transform(wrapped, {
    presets: ['react'],
    parserOpts: { allowReturnOutsideFunction: true },
  }).code;
  const factory = new Function(
    'React', 'useState', 'useEffect', 'useRef',
    compiled
  );
  return factory(React, React.useState, React.useEffect, React.useRef);
}

// ───────────────────────────────────────────────────────────
// CODEMIRROR EDITOR / VIEWER
// ───────────────────────────────────────────────────────────

function CodeMirrorView({ value, onChange, onSubmit, readOnly = false }) {
  const containerRef = useRef(null);
  const cmRef = useRef(null);
  const onChangeRef = useRef(onChange);
  const onSubmitRef = useRef(onSubmit);
  onChangeRef.current = onChange;
  onSubmitRef.current = onSubmit;

  useEffect(() => {
    if (!containerRef.current) return;
    if (typeof CodeMirror === 'undefined') return;

    const cm = CodeMirror(containerRef.current, {
      value: value || '',
      mode: 'jsx',
      lineNumbers: !readOnly,
      readOnly: readOnly,
      indentUnit: 2,
      tabSize: 2,
      smartIndent: true,
      lineWrapping: false,
      viewportMargin: Infinity,
      matchBrackets: true,
      extraKeys: {
        Tab: function(cm) {
          if (cm.somethingSelected()) {
            cm.indentSelection('add');
          } else {
            cm.replaceSelection('  ', 'end', '+input');
          }
        },
        'Ctrl-Enter': function() {
          if (onSubmitRef.current) onSubmitRef.current();
        },
        'Cmd-Enter': function() {
          if (onSubmitRef.current) onSubmitRef.current();
        },
      },
    });
    cmRef.current = cm;

    if (!readOnly) {
      cm.on('change', function(instance) {
        if (onChangeRef.current) onChangeRef.current(instance.getValue());
      });
    }

    return function cleanup() {
      const wrapper = cm.getWrapperElement();
      if (wrapper && wrapper.parentNode) {
        wrapper.parentNode.removeChild(wrapper);
      }
      cmRef.current = null;
    };
  }, []);

  // Sync external value changes (e.g., reset, lesson change)
  useEffect(() => {
    if (cmRef.current && cmRef.current.getValue() !== value) {
      cmRef.current.setValue(value || '');
    }
  }, [value]);

  return <div ref={containerRef} className={readOnly ? 'cm-readonly' : 'cm-editor'} />;
}

function Preview({ code, componentName, onError }) {
  const containerRef = useRef(null);
  const rootRef = useRef(null);
  const [empty, setEmpty] = useState(false);

  useEffect(() => {
    if (!containerRef.current) return;
    try {
      const Component = compileComponent(code, componentName);
      if (!Component) {
        setEmpty(true);
        if (onError) onError(null);
        // Unmount previous if any
        if (rootRef.current) {
          const r = rootRef.current;
          rootRef.current = null;
          setTimeout(() => r.unmount(), 0);
        }
        return;
      }
      setEmpty(false);
      if (!rootRef.current) {
        rootRef.current = ReactDOM.createRoot(containerRef.current);
      }
      rootRef.current.render(React.createElement(Component));
      if (onError) onError(null);
    } catch (err) {
      if (onError) onError(err.message);
    }
  }, [code, componentName]);

  useEffect(() => () => {
    if (rootRef.current) {
      const r = rootRef.current;
      rootRef.current = null;
      setTimeout(() => r.unmount(), 0);
    }
  }, []);

  return (
    <div className="preview-frame">
      <div ref={containerRef} />
      {empty && <div className="preview-empty">No component named "{componentName}" found.</div>}
    </div>
  );
}

// ───────────────────────────────────────────────────────────
// PROGRESS PERSISTENCE
// ───────────────────────────────────────────────────────────

const STORAGE_KEY = 'react-bolt-progress-v1';
const CODE_KEY = 'react-bolt-code-v1';

function loadProgress() {
  try {
    return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
  } catch {
    return new Set();
  }
}

function saveProgress(set) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...set]));
  } catch {}
}

function loadCode() {
  try {
    return JSON.parse(localStorage.getItem(CODE_KEY) || '{}');
  } catch {
    return {};
  }
}

function saveCode(obj) {
  try {
    localStorage.setItem(CODE_KEY, JSON.stringify(obj));
  } catch {}
}

// ───────────────────────────────────────────────────────────
// MAIN APP
// ───────────────────────────────────────────────────────────

function App() {
  const [activeId, setActiveId] = useState(LESSONS[0].id);
  const [savedCodes, setSavedCodes] = useState(loadCode);   // {id: code} — what's been Run
  const [completed, setCompleted] = useState(loadProgress);
  const [error, setError] = useState(null);
  const [showSolution, setShowSolution] = useState(false);

  const lesson = LESSONS.find(l => l.id === activeId);
  const lessonIndex = LESSONS.findIndex(l => l.id === activeId);

  // Editor draft (what's in the textarea right now)
  const [draft, setDraft] = useState(savedCodes[activeId] || lesson.starterCode);

  // When the active lesson changes, reset draft and UI state
  useEffect(() => {
    setDraft(savedCodes[activeId] || lesson.starterCode);
    setError(null);
    setShowSolution(false);
  }, [activeId]);

  // What the preview should render: the last "Run" code, or starter if never run
  const runCode = savedCodes[activeId] || lesson.starterCode;

  function handleRun() {
    const next = { ...savedCodes, [activeId]: draft };
    setSavedCodes(next);
    saveCode(next);
  }

  function handleReset() {
    setDraft(lesson.starterCode);
    const next = { ...savedCodes };
    delete next[activeId];
    setSavedCodes(next);
    saveCode(next);
    setError(null);
  }

  function handleMarkComplete() {
    const next = new Set(completed);
    next.add(activeId);
    setCompleted(next);
    saveProgress(next);
  }

  function handleNext() {
    handleMarkComplete();
    if (lessonIndex < LESSONS.length - 1) {
      setActiveId(LESSONS[lessonIndex + 1].id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function handlePrev() {
    if (lessonIndex > 0) {
      setActiveId(LESSONS[lessonIndex - 1].id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  // Tab and Ctrl/Cmd+Enter are handled inside CodeMirror via extraKeys.

  return (
    <div className="app">
      <aside className="sidebar">
        <h1>React Bolt</h1>
        <p className="tagline">Learn React by doing.</p>
        <div className="module-title">Module 1 — State & Inputs</div>
        {LESSONS.map(l => (
          <div
            key={l.id}
            className={'lesson-item ' + (l.id === activeId ? 'active' : '')}
            onClick={() => setActiveId(l.id)}
          >
            <span className="num">{l.id}</span>{l.title}
            {completed.has(l.id) && <span className="check">✓</span>}
          </div>
        ))}
      </aside>

      <main className="main">
        <div className="breadcrumb">Module 1 · Lesson {lesson.id}</div>
        <h2 className="lesson-title">{lesson.title}</h2>

        <div className="concept" dangerouslySetInnerHTML={{ __html: lesson.concept }} />

        <div className="section-title">Example</div>
        <div className="example-area">
          <CodeMirrorView value={lesson.exampleCode} readOnly />
          <Preview code={lesson.exampleCode} componentName="Example" />
        </div>

        <div className="section-title">Your turn</div>
        <div className="concept" dangerouslySetInnerHTML={{ __html: lesson.exerciseDescription }} />

        <CodeMirrorView
          value={draft}
          onChange={setDraft}
          onSubmit={handleRun}
        />

        <div className="button-row">
          <button className="run-btn" onClick={handleRun}>▶ Run (⌘/Ctrl + Enter)</button>
          <button className="secondary-btn" onClick={handleReset}>Reset</button>
          <button className="secondary-btn" onClick={() => setShowSolution(!showSolution)}>
            {showSolution ? 'Hide solution' : 'Show solution'}
          </button>
        </div>

        {error && <pre className="error">{error}</pre>}

        <p className="result-label">Result</p>
        <Preview code={runCode} componentName="Exercise" onError={setError} />

        {showSolution && (
          <div className="solution-panel">
            <div className="section-title">Solution</div>
            <CodeMirrorView value={lesson.solution} readOnly />
          </div>
        )}

        <div className="nav">
          <button className="nav-btn outline" onClick={handlePrev} disabled={lessonIndex === 0}>
            ← Previous
          </button>
          {!completed.has(activeId) && (
            <button className="nav-btn outline" onClick={handleMarkComplete}>
              Mark complete ✓
            </button>
          )}
          <button className="nav-btn" onClick={handleNext} disabled={lessonIndex === LESSONS.length - 1}>
            Next →
          </button>
        </div>
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
